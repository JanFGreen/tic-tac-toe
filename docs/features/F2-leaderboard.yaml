feature_id: TTT-F2-LEADERBOARD
repo_id: tic-tak-toe
original_request: |
  Add an online leaderboard for games against the computer, served by the Node.js API.

  - After a round against the computer, the player can save the result under a nickname.
    The nickname is remembered on the device for the next time.
  - The server stores results and offers a leaderboard per difficulty: best players first,
    with wins, draws and losses. The client shows it on its own screen, reachable from the game.
  - The API must be safe to expose on the internet: validate every input, limit sizes and the rate
    of writes, and never trust the client for more than it can know.
  - Results survive a server restart (Node's built-in SQLite, a file under data/).
  - When the server is unreachable the game still works; saving and the leaderboard explain the
    problem and offer a retry.
goal: Players can save results against the computer and compare themselves on a leaderboard.
constraints:
  - Fastify API in src/server, buildApp() stays testable with inject; storage through one module.
  - No new dependencies (fastify, @fastify/rate-limit, zod and node:sqlite are available).
